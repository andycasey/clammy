[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clammy"
version = "0.1.0"
description = "Joint radial-velocity, template-weight, continuum, and spectral-resolution fitting for stellar spectra, on JAX."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andy Casey" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "astropy>=6.0",
    "matplotlib>=3.8",
    "jax>=0.4",
]

[project.optional-dependencies]
# only needed to (re)build the PHOENIX template grid from raw HiRes files
templates = ["ppxf>=9.0"]

[project.scripts]
clammy = "clammy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["clammy*"]
